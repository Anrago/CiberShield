version: '3.7'
services:
  # back:
  #   build:
  #     context: ./back
  #     dockerfile: DockerFile
  #   container_name: back
  #   ports:
  #     - 3000:3000
  #   depends_on:
  #     - dbCiberShield
  #   networks:
  #     - ciberShieldNetwork

  dbCiberShield:
    env_file:
      - .env
    image: postgres:13
    container_name: dbCiberShield
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ciberShield
    ports:
      - 5432:5432
    volumes:
      - dbCiberShield:/var/lib/postgresql/data
    networks:
      - ciberShieldNetwork
    restart: unless-stopped


  front:
    build:
      context: ./front
      dockerfile: DockerFile
    container_name: front
    ports:
      - 5173:5173
    # depends_on:
    #   - back
    networks:
      - ciberShieldNetwork

volumes:
  dbCiberShield:
    driver: local

networks:
  ciberShieldNetwork:
    driver: bridge