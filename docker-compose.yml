version: '3.7'
services:
  back:
    build:
      context: ./back
      dockerfile: DockerFile
    container_name: back
    ports:
      - 3000:3000
    depends_on:
      - dbCiberShield
    networks:
      - ciberShieldNetwork
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://cibershieldAdmin:cibershieldAdmin@dbCiberShield:5432/ciberShield?schema=public
      - NODE_ENV=production
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY_ROLE=${SUPABASE_KEY_ROLE}
      - MY_OPENAI_API=${MY_OPENAI_API}
      - CORS_ORIGIN=http://localhost:5173
    volumes:
      - ./back/uploads:/app/uploads

  dbCiberShield:
    env_file:
      - .env
    image: postgres:13
    container_name: dbCiberShield
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ciberShield
    ports:
      - 5432:5432
    volumes:
      - dbCiberShield:/var/lib/postgresql/data
    networks:
      - ciberShieldNetwork
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  front:
    build:
      context: ./front
      dockerfile: DockerFile
    container_name: front
    ports:
      - 5173:5173
    networks:
      - ciberShieldNetwork

volumes:
  dbCiberShield:
    driver: local

networks:
  ciberShieldNetwork:
    driver: bridge
